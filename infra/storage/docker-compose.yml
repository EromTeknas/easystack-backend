services:
  minio:
    image: quay.io/minio/minio:RELEASE.2024-03-30T09-41-56Z
    command: server /data --console-address ":9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET}
    volumes:
      - ./minio-init.sh:/minio-init.sh:ro
      - ./cors.json:/cors.json:ro
    entrypoint: ["/bin/sh", "/minio-init.sh"]

  storage-cdn:
    image: nginx:alpine
    depends_on:
      - minio
    env_file:
      - .env
    ports:
      - "${STORAGE_CDN_PORT}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-cache:/var/cache/nginx

volumes:
  minio-data:
  nginx-cache:
