events {}

http {
  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=storage_public:10m max_size=1g inactive=24h;

  server {
    listen 80;

    location /public/ {
      proxy_pass http://minio:9000/easystack/public/;
      proxy_cache storage_public;
      proxy_cache_valid 200 1h;
      add_header X-Cache-Status $upstream_cache_status;
    }

    location / {
      return 404;
    }
  }
}
