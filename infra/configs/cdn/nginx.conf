events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" env:"$env" cache:$upstream_cache_status';

  access_log /var/log/nginx/access.log main;
  error_log /var/log/nginx/error.log warn;

  sendfile on;
  keepalive_timeout 65;

  # Shared cache zone for all environments (keyed by environment + URI)
  proxy_cache_path /var/cache/nginx
    levels=1:2
    keys_zone=storage_public:20m
    max_size=5g
    inactive=48h
    use_temp_path=off;

  # DNS resolver for dynamic proxy_pass hostname resolution inside Docker
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    server_name localhost;

    # CDN Health Check
    location /health {
      access_log off;
      add_header Content-Type application/json;
      return 200 '{"status":"healthy","service":"easystack-cdn","storage":"minio"}';
    }

    # Dynamic Multi-Environment Caching Location:
    # Matches /<any-environment>/public/<asset-path>
    # Proxies to MinIO S3 bucket: easystack-<environment>/public/<asset-path>
    location ~ ^/(?<env>[a-zA-Z0-9_-]+)/public/(?<asset>.*)$ {
      set $s3_upstream http://minio:9000;
      proxy_pass $s3_upstream/easystack-$env/public/$asset$is_args$args;

      proxy_set_header Host minio:9000;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Cache configuration
      proxy_cache storage_public;
      proxy_cache_key "$env$request_uri";
      proxy_cache_methods GET HEAD;
      proxy_cache_valid 200 48h;
      proxy_cache_valid 404 1m;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

      add_header X-Cache-Status $upstream_cache_status always;
      add_header X-Environment $env always;
      add_header Access-Control-Allow-Origin * always;
      add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
      add_header Access-Control-Allow-Headers "*" always;
      add_header Access-Control-Expose-Headers "ETag, X-Cache-Status, X-Environment, Content-Length" always;

      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Access-Control-Max-Age 3600 always;
        add_header Content-Length 0;
        return 204;
      }
    }

    location / {
      return 404 '{"error":"Not Found","message":"Invalid CDN path. Use /<env>/public/<file>"}';
    }
  }
}
