services:
  mysql:
    image: mysql:8.0.36
    container_name: easystack-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    env_file:
      - ${SHARED_ENV_FILE:-./env/.env.shared}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      ENVIRONMENTS: ${ENVIRONMENTS}
    ports:
      - "${MYSQL_HOST_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-scripts/01-init-mysql.sh:/docker-entrypoint-initdb.d/01-init-mysql.sh:ro
    networks:
      - easystack-core-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongodb:
    image: mongo:7.0.6
    container_name: easystack-mongodb
    restart: unless-stopped
    env_file:
      - ${SHARED_ENV_FILE:-./env/.env.shared}
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      ENVIRONMENTS: ${ENVIRONMENTS}
    ports:
      - "${MONGO_HOST_PORT}:27017"
    volumes:
      - mongo_data:/data/db
      - ./init-scripts/02-init-mongo.sh:/docker-entrypoint-initdb.d/02-init-mongo.sh:ro
    networks:
      - easystack-core-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7.2.4-alpine
    container_name: easystack-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    env_file:
      - ${SHARED_ENV_FILE:-./env/.env.shared}
    ports:
      - "${REDIS_HOST_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - easystack-core-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    container_name: easystack-seaweedfs
    restart: unless-stopped
    command: "server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json -s3.port=8333 -filer -ip.bind=0.0.0.0"
    env_file:
      - ${SHARED_ENV_FILE:-./env/.env.shared}
    ports:
      - "${SEAWEED_S3_PORT}:8333"
      - "${SEAWEED_S3_ALT_PORT}:8333"
      - "${SEAWEED_MASTER_PORT}:9333"
      - "${SEAWEED_FILER_PORT}:8888"
    volumes:
      - seaweed_data:/data
      - ./configs/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      - easystack-core-net
      - easystack-edge-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8888/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 25s

  seaweedfs-init:
    image: alpine:3.19
    container_name: easystack-seaweedfs-init
    depends_on:
      seaweedfs:
        condition: service_healthy
    env_file:
      - ${SHARED_ENV_FILE:-./env/.env.shared}
    environment:
      ENVIRONMENTS: ${ENVIRONMENTS}
      STORAGE_S3_BUCKET_PREFIX: ${STORAGE_S3_BUCKET_PREFIX}
    volumes:
      - ./configs/seaweedfs/seaweedfs-init.sh:/seaweedfs-init.sh:ro
    networks:
      - easystack-core-net
    entrypoint: ["/bin/sh", "/seaweedfs-init.sh"]

  cdn:
    image: nginx:1.25.4-alpine
    container_name: easystack-cdn
    restart: unless-stopped
    depends_on:
      seaweedfs:
        condition: service_healthy
    env_file:
      - ${SHARED_ENV_FILE:-./env/.env.shared}
    ports:
      - "${CDN_HOST_PORT}:80"
    volumes:
      - ./configs/cdn/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_cache:/var/cache/nginx
    networks:
      - easystack-core-net
      - easystack-edge-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  jenkins:
    build:
      context: ./docker
      dockerfile: jenkins.Dockerfile
    container_name: easystack-jenkins
    restart: unless-stopped
    user: root
    env_file:
      - ${SHARED_ENV_FILE:-./env/.env.shared}
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=true"
    ports:
      - "${JENKINS_HOST_PORT}:8080"
      - "${JENKINS_AGENT_PORT}:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - easystack-ci-net
      - easystack-core-net

volumes:
  mysql_data:
  mongo_data:
  redis_data:
  seaweed_data:
  nginx_cache:
  jenkins_home:

networks:
  easystack-core-net:
    name: easystack-core-net
    driver: bridge
  easystack-edge-net:
    name: easystack-edge-net
    driver: bridge
  easystack-ci-net:
    name: easystack-ci-net
    driver: bridge
