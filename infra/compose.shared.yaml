services:
  mysql:
    image: mysql:8.0.36
    container_name: easystack-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_HOST_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - easystack-core-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongodb:
    image: mongo:7.0.6
    container_name: easystack-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "${MONGO_HOST_PORT}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - easystack-core-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7.2.4-alpine
    container_name: easystack-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_HOST_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - easystack-core-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  minio:
    image: jumpserver/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: easystack-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
    networks:
      - easystack-core-net
      - easystack-edge-net
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", ": > /dev/tcp/127.0.0.1/9000"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  minio-init:
    image: jumpserver/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: easystack-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      ENVIRONMENTS: ${ENVIRONMENTS}
      STORAGE_S3_BUCKET_PREFIX: ${STORAGE_S3_BUCKET_PREFIX}
    volumes:
      - ./configs/minio/minio-init.sh:/minio-init.sh:ro
    networks:
      - easystack-core-net
    entrypoint: ["/bin/sh", "/minio-init.sh"]

  cdn:
    image: nginx:1.25.4-alpine
    container_name: easystack-cdn
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "${CDN_HOST_PORT}:80"
    volumes:
      - ./configs/cdn/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_cache:/var/cache/nginx
    networks:
      - easystack-core-net
      - easystack-edge-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  jenkins:
    build:
      context: ./docker
      dockerfile: jenkins.Dockerfile
    container_name: easystack-jenkins
    restart: unless-stopped
    user: root
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=true"
    ports:
      - "${JENKINS_HOST_PORT}:8080"
      - "${JENKINS_AGENT_PORT}:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - easystack-ci-net
      - easystack-core-net

volumes:
  mysql_data:
  mongo_data:
  redis_data:
  minio_data:
  nginx_cache:
  jenkins_home:

networks:
  easystack-core-net:
    name: easystack-core-net
    driver: bridge
  easystack-edge-net:
    name: easystack-edge-net
    driver: bridge
  easystack-ci-net:
    name: easystack-ci-net
    driver: bridge
